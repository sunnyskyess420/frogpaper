# FrogPaper lint configuration (roadmap #7 Phase C).
#
# Scope: the rule families that match this project's real failure
# history:
#   F821 - undefined names. This is the exact bug class that crashed the
#          first launch after the Phase B2 modularization (NameError:
#          SV_TTK_AVAILABLE in app_theme_engine.py) while all unit tests
#          stayed green.
#   F811 - redefinitions / shadowed duplicates. The same extraction work
#          left 3 dead duplicate method copies; these are now removed.
#   F401 - unused imports. Cleaned 2026-09-03: 132 dead imports deleted,
#          21 availability-probe imports marked inline with
#          `# noqa: F401  (availability probe)`, and the intentional
#          STATUS_COLORS facade re-export in settings_tab.py marked with
#          its own noqa. New dead imports will now fail the check.
#
# Run:  ruff check .          (from the project root)
#       ruff check . --fix    (where a fix is offered)

line-length = 200
target-version = "py312"

extend-exclude = [
    "backup",
    "build",
    "dist",
    "venv",
]

[lint]
select = ["F821", "F811", "F401"]

[lint.per-file-ignores]
# Visual Refresh P2: the historical `_show_toast references ImageTk, which
# was never bound in that scope` F821 baseline is RESOLVED. The ImageTk
# import is now present at the top of app_system_mixin.py (as `_ImageTk`),
# the toast drop-shadow actually renders, and the silent `except: pass`
# fallback is no longer the code path. No per-file F821 carve-out needed
# for this module any more.
