# FrogPaper CI — runs the full unittest suite on a real Windows runner.
#
# Why Windows: the app is Windows-only (Tkinter UI, ctypes.windll, registry
# paths), so this runner matches your machine — including the one test that
# can never pass on Linux (test_logging_rotation's windll handler check).
# Tkinter works out of the box on GitHub's windows-latest runners.
#
# Lean install on purpose: the test suite is designed to run with the heavy
# optional dependencies ABSENT (each module guards/stubs them — same set the
# suite was verified green with). Installing requirements.txt verbatim would
# pull sentence-transformers -> torch (~2-3 GB, ~10 extra minutes per run)
# for zero additional test coverage.
#
# Place this file at: .github/workflows/tests.yml  (repo root)
# Then: git add .github/workflows/tests.yml && git push
# View runs under the repo's "Actions" tab. Expected: "Ran 301 tests ... OK".
#
# Minutes note: each matrix entry is one Windows job (Windows minutes count
# 2x on private repos). The suite finishes in ~4-5 min per entry. Trim the
# matrix to just your local Python version if you want it leaner.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button on the Actions tab

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.8.4

      - name: Ruff (F821 undefined names + F811 shadowed defs)
        run: ruff check .

  tests:
    needs: lint          # don't burn Windows minutes on code that fails lint
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies (lean set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow keyring nltk opencv-python-headless huggingface_hub

      - name: Run test suite (same command as run_tests.bat)
        run: python -m unittest discover -s tests -v
